<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #faf8ef;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #776e65;
  }
  .container { text-align: center; }
  h1 { font-size: 64px; font-weight: 800; color: #776e65; margin-bottom: 8px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0;
    color: #fff;
    border-radius: 6px;
    padding: 8px 20px;
    min-width: 90px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #eee4da; }
  .score-box .value { font-size: 24px; font-weight: 700; }
  #board {
    position: relative;
    background: #bbada0;
    border-radius: 10px;
    padding: 10px;
    width: 460px;
    height: 460px;
  }
  .grid { display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: 10px; width: 100%; height: 100%; }
  .cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }
  .tile {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    font-weight: 700;
    transition: all 100ms ease-in-out;
    z-index: 2;
  }
  .tile.new { animation: pop 180ms ease; }
  .tile.merged { animation: mergepop 180ms ease; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes mergepop { 0% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .message {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    font-size: 48px;
    font-weight: 800;
  }
  .message.show { display: flex; }
  .message button {
    margin-top: 16px;
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .hint { margin-top: 14px; font-size: 14px; color: #776e65; }
  button.newgame {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>2048</h1>
  <div class="header">
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <button class="newgame" onclick="newGame()">New Game</button>
  </div>
  <div id="board">
    <div class="grid">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div id="tiles"></div>
    <div class="message" id="message"><span id="msgtext">Game Over!</span><button onclick="newGame()">Try Again</button></div>
  </div>
  <div class="hint">Use arrow keys to move tiles. Merge equal tiles to reach 2048!</div>
</div>
<script>
const SIZE = 4;
const TILE_PX = 100, GAP = 10, PAD = 10;
let grid, score, best = 0, tileId = 0, tiles = {}, over = false;

try { best = parseInt(localStorage.getItem('best2048') || '0'); } catch(e) {}

function posRC(r, c) { return { x: PAD + c * (TILE_PX + GAP), y: PAD + r * (TILE_PX + GAP) }; }

const COLORS = {
  2:    { bg: '#eee4da', fg: '#776e65' },
  4:    { bg: '#ede0c8', fg: '#776e65' },
  8:    { bg: '#f2b179', fg: '#f9f6f2' },
  16:   { bg: '#f59563', fg: '#f9f6f2' },
  32:   { bg: '#f67c5f', fg: '#f9f6f2' },
  64:   { bg: '#f65e3b', fg: '#f9f6f2' },
  128:  { bg: '#edcf72', fg: '#f9f6f2' },
  256:  { bg: '#edcc61', fg: '#f9f6f2' },
  512:  { bg: '#edc850', fg: '#f9f6f2' },
  1024: { bg: '#edc53f', fg: '#f9f6f2' },
  2048: { bg: '#edc22e', fg: '#f9f6f2' },
  4096: { bg: '#3c3a32', fg: '#f9f6f2' }
};

function newGame() {
  grid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  score = 0; over = false; tileId = 0; tiles = {};
  document.getElementById('tiles').innerHTML = '';
  document.getElementById('message').classList.remove('show');
  addRandomTile(); addRandomTile();
  updateScore();
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  const v = Math.random() < 0.9 ? 2 : 4;
  const id = ++tileId;
  grid[r][c] = { id, value: v };
  createTileEl(id, v, r, c, 'new');
}

function createTileEl(id, value, r, c, anim) {
  const el = document.createElement('div');
  el.className = 'tile' + (anim ? ' ' + anim : '');
  el.dataset.id = id;
  el.textContent = value;
  const p = posRC(r, c);
  const col = COLORS[value] || COLORS[4096];
  el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${TILE_PX}px;height:${TILE_PX}px;` +
    `background:${col.bg};color:${col.fg};font-size:${value >= 1024 ? 28 : value >= 128 ? 34 : 40}px;`;
  document.getElementById('tiles').appendChild(el);
  tiles[id] = { el, value };
}

function setTilePos(id, r, c) {
  const p = posRC(r, c);
  const t = tiles[id];
  t.el.style.left = p.x + 'px';
  t.el.style.top = p.y + 'px';
}

function updateScore() {
  document.getElementById('score').textContent = score;
  if (score > best) { best = score; try { localStorage.setItem('best2048', best); } catch(e) {} }
  document.getElementById('best').textContent = best;
}

function slide(row) {
  // row: array of tile refs or null; returns {row, gained}
  const vals = row.filter(x => x);
  const out = [];
  let gained = 0;
  let i = 0;
  while (i < vals.length) {
    if (i + 1 < vals.length && vals[i].value === vals[i + 1].value) {
      // merge: first tile survives, second is consumed
      vals[i].mergedInto = true;
      vals[i].consumed = vals[i + 1];
      vals[i].value *= 2;
      gained += vals[i].value;
      out.push(vals[i]);
      i += 2;
    } else {
      out.push(vals[i]);
      i++;
    }
  }
  while (out.length < SIZE) out.push(null);
  return { row: out, gained };
}

function move(dir) {
  if (over) return;
  // dir: 0=left,1=up,2=right,3=down
  const movedTiles = []; // {id, r, c}
  const consumedIds = [];
  let gained = 0, moved = false;
  const newGrid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));

  const getLine = (k) => {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 0) line.push(grid[k][j]);
      else if (dir === 2) line.push(grid[k][SIZE - 1 - j]);
      else if (dir === 1) line.push(grid[j][k]);
      else line.push(grid[SIZE - 1 - j][k]);
    }
    return line;
  };
  const setPos = (k, j) => {
    if (dir === 0) return [k, j];
    if (dir === 2) return [k, SIZE - 1 - j];
    if (dir === 1) return [j, k];
    return [SIZE - 1 - j, k];
  };

  for (let k = 0; k < SIZE; k++) {
    const line = getLine(k);
    const res = slide(line);
    gained += res.gained;
    for (let j = 0; j < SIZE; j++) {
      const t = res.row[j];
      if (!t) continue;
      const [r, c] = setPos(k, j);
      newGrid[r][c] = { id: t.id, value: t.value };
      if (!tiles[t.id].el) moved = true;
      movedTiles.push({ id: t.id, r, c });
      if (t.consumed) consumedIds.push(t.consumed.id);
      if (grid[r][c] && grid[r][c].id !== t.id) moved = true;
      if (!grid[r][c]) moved = true;
    }
  }

  if (!moved) return;

  grid = newGrid;
  for (const m of movedTiles) setTilePos(m.id, m.r, m.c);
  // remove consumed tiles and update values
  setTimeout(() => {
    for (const id of consumedIds) {
      tiles[id].el.remove();
      delete tiles[id];
    }
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const t = grid[r][c];
      if (t) {
        const el = tiles[t.id].el;
        if (parseInt(el.textContent) !== t.value) {
          el.textContent = t.value;
          const col = COLORS[t.value] || COLORS[4096];
          el.style.background = col.bg;
          el.style.color = col.fg;
          el.style.fontSize = (t.value >= 1024 ? 28 : t.value >= 128 ? 34 : 40) + 'px';
          el.classList.remove('merged'); void el.offsetWidth; el.classList.add('merged');
        }
      }
    }
  }, 100);

  if (gained > 0) { score += gained; updateScore(); }
  addRandomTile();

  if (!movesAvailable()) {
    over = true;
    document.getElementById('msgtext').textContent = 'Game Over!';
    document.getElementById('message').classList.add('show');
  }
}

function movesAvailable() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (!grid[r][c]) return true;
    if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === grid[r][c].value) return true;
    if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === grid[r][c].value) return true;
  }
  return false;
}

document.addEventListener('keydown', (e) => {
  const map = { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };
  if (e.key in map) { e.preventDefault(); move(map[e.key]); }
});

// touch swipe support
let touchStart = null;
document.addEventListener('touchstart', (e) => { touchStart = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart[0];
  const dy = e.changedTouches[0].clientY - touchStart[1];
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 2 : 0);
  else move(dy > 0 ? 3 : 1);
  touchStart = null;
}, { passive: true });

newGame();
</script>
</body>
</html>
