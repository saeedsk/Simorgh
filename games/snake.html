<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Snake</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1d23;color:#e0e0e0;font-family:system-ui,sans-serif}h1{font-weight:600;margin-bottom:8px}#score{color:#9aa4b2;margin:0 0 12px}canvas{background:#12141a;border:2px solid #3a4150;border-radius:6px}#hint{color:#6b7482;font-size:14px;margin-top:12px}</style></head>
<body><h1>Snake</h1><p id="score">Score: 0</p><canvas id="board" width="400" height="400"></canvas>
<p id="hint">Arrow keys to move. Press any key to restart after Game Over.</p>
<script>
(()=>{const CELL=20,COLS=20,ROWS=20,c=document.getElementById('board'),x=c.getContext('2d'),sEl=document.getElementById('score');
let snake,dir,nextDir,food,score,dead;
function foodAt(){const o=new Set(snake.map(s=>s.x+','+s.y)),e=[];for(let y=0;y<ROWS;y++)for(let cx=0;cx<COLS;cx++)if(!o.has(cx+','+y))e.push({x:cx,y});return e.length?e[Math.floor(Math.random()*e.length)]:null}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;dead=false;food=foodAt();sEl.textContent='Score: 0';draw()}
function end(){dead=true;x.fillStyle='rgba(0,0,0,0.7)';x.fillRect(0,0,400,400);x.textAlign='center';x.fillStyle='#ff5555';x.font='bold 32px system-ui';x.fillText('Game Over',200,190);x.fillStyle='#e0e0e0';x.font='18px system-ui';x.fillText('Final score: '+score,200,224);x.fillText('Press any key to restart',200,252)}
function draw(){x.clearRect(0,0,400,400);if(food){x.fillStyle='#e74c3c';x.beginPath();x.arc(food.x*CELL+10,food.y*CELL+10,7,0,Math.PI*2);x.fill()}snake.forEach((s,i)=>{x.fillStyle=i===0?'#2ecc71':'#27ae60';x.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2)})}
function step(){if(dead)return;dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y))return end();snake.unshift(h);if(food&&h.x===food.x&&h.y===food.y){score++;sEl.textContent='Score: '+score;food=foodAt();if(!food)return end()}else snake.pop();draw()}
document.addEventListener('keydown',e=>{if(dead){reset();return}const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};const nd=m[e.key];if(!nd)return;e.preventDefault();if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd});
reset();setInterval(step,110);
})();
</script></body></html>
