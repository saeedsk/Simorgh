<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simorgh Platformer</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0b0f1a;
    display: flex; justify-content: center; align-items: center;
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #87CEEB;
  }
  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    padding: 10px 16px;
    box-sizing: border-box;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 3px rgba(0,0,0,0.6);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  #hud .left, #hud .right { display: flex; gap: 20px; align-items: center; }
  .heart { color: #ff4d5e; }
  .coin { color: #ffd93d; }
  #overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(0,0,0,0.75);
    color: #fff;
    text-align: center;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 48px; margin: 0 0 10px 0; text-shadow: 3px 3px 0 #000; }
  #overlay p { font-size: 20px; margin: 6px 0; }
  #overlay button {
    margin-top: 20px;
    padding: 12px 28px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    background: #4ecca3;
    color: #0b0f1a;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  #overlay button:hover { background: #6fe0bd; transform: scale(1.05); }
  #levelBanner {
    position: absolute;
    top: 40%;
    left: 0; width: 100%;
    text-align: center;
    color: #fff;
    font-size: 36px;
    font-weight: bold;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 15;
  }
  #levelBanner.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <div class="left">
      <span id="lives">❤️❤️❤️</span>
      <span class="coin">💎 <span id="coins">0</span></span>
    </div>
    <div class="right">
      <span id="levelLabel">Level 1 / 3</span>
    </div>
  </div>
  <div id="levelBanner"></div>
  <div id="overlay" class="hidden">
    <h1 id="overlayTitle">Paused</h1>
    <p id="overlaySub"></p>
    <button id="overlayBtn">Start</button>
  </div>
</div>

<script>

const MOVE_FRICTION = 0.82;
const MAX_RUN = 5.4;
const JUMP_VELOCITY = -11.6;
const COYOTE_FRAMES = 8;
const JUMP_BUFFER_FRAMES = 8;
const AIR_JUMPS_MAX = 1; // one double-jump

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp',' ','Space','KeyA','KeyD','KeyW'].includes(e.code) || e.key===' ') {
    e.preventDefault();
  }
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    jumpPressedThisFrame = true;
    jumpBufferTimer = JUMP_BUFFER_FRAMES;
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
let jumpPressedThisFrame = false;
let jumpBufferTimer = 0;

function left()  { return keys['ArrowLeft'] || keys['KeyA']; }
function right() { return keys['ArrowRight'] || keys['KeyD']; }

// ---------- Utility ----------
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

      ],

        {x:960, y:400, w:90, h:20, axis:'x', range:150, speed:1.8, phase:1},
        {x:1740,y:400, w:90, h:20, axis:'y', range:120, speed:1.3, phase:3, baseY:400},

      ],

        {x:1400,y:530, w:80},

        {x:1980,y:530, w:80},
        {x:2180,y:530, w:80},

        {x:2880,y:530, w:80}
      ],
      coins: [
        {x:340,y:360},{x:520,y:300},{x:700,y:240},
        {x:900,y:400},{x:940,y:400},

        {x:1540,y:400},{x:1580,y:400},{x:1620,y:400},{x:1660,y:400},

      ],

        {x:1520,y:428, w:36, h:32, minX:1500,maxX:1760, speed:2.0, dir:1, type:'spike'},
        {x:2300,y:428, w:36, h:32, minX:2280,maxX:2460, speed:1.6, dir:-1, type:'slime'},
        {x:2600,y:428, w:36, h:32, minX:2580,maxX:2760, speed:2.2, dir:1, type:'spike'},
        {x:3000,y:428, w:36, h:32, minX:2980,maxX:3360, speed:1.9, dir:1, type:'slime'}
      ],
      goal: {x:3330, y:390, w:40, h:70}
    }

}

// ---------- Game State ----------
let levels = makeLevels();
let levelIndex = 0;
let level = levels[levelIndex];

const player = {
  x:0, y:0, w:30, h:42,
  vx:0, vy:0,
  onGround:false,
  facing:1,
  coyoteTimer:0,
  airJumpsLeft:AIR_JUMPS_MAX,
  invuln:0,
  alive:true
};

let camX = 0;
let score = 0;
let lives = 3;
let coinsCollectedThisLevel = new Set();
let currentCheckpoint = null;
let gameState = 'start'; // start, playing, dead, levelComplete, win, paused
let bannerTimer = 0;
let frame = 0;
let animTimer = 0;

function resetPlayerToCheckpoint() {
  const cp = currentCheckpoint || level.playerStart;
  player.x = cp.x;
  player.y = cp.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.coyoteTimer = 0;
  player.airJumpsLeft = AIR_JUMPS_MAX;
  player.invuln = 60;
}

function loadLevel(idx) {
  levelIndex = idx;
  level = levels[levelIndex];
  currentCheckpoint = level.playerStart;
  coinsCollectedThisLevel = new Set();
  resetPlayerToCheckpoint();
  camX = 0;
  showBanner(level.name);
  document.getElementById('levelLabel').textContent = `Level ${levelIndex+1} / ${levels.length}`;
}

function showBanner(text) {
  const el = document.getElementById('levelBanner');
  el.textContent = text;
  el.classList.add('show');
  bannerTimer = 120;
}

function fullReset() {
  score = 0;
  lives = 3;
  loadLevel(0);
}

function loseLife() {
  if (player.invuln > 0) return;
  lives--;
  updateHUD();
  if (lives <= 0) {
    gameState = 'dead';
    showOverlay('You Died', `Final Score: ${score}`, 'Try Again');
  } else {
    resetPlayerToCheckpoint();
  }
}

function updateHUD() {
  const heartsEl = document.getElementById('lives');
  let hearts = '';
  for (let i=0;i<Math.max(lives,0);i++) hearts += '❤️';
  heartsEl.textContent = hearts || '💀';
  document.getElementById('coins').textContent = score;
}

// ---------- Overlay handling ----------
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlaySub = document.getElementById('overlaySub');
const overlayBtn = document.getElementById('overlayBtn');

function showOverlay(title, sub, btnText) {
  overlayTitle.textContent = title;
  overlaySub.textContent = sub;
  overlayBtn.textContent = btnText;
  overlay.classList.remove('hidden');
}
function hideOverlay() {
  overlay.classList.add('hidden');
}

overlayBtn.addEventListener('click', () => {
  if (gameState === 'start') {
    fullReset();
    gameState = 'playing';
    hideOverlay();
  } else if (gameState === 'dead') {
    fullReset();
    gameState = 'playing';
    hideOverlay();
  } else if (gameState === 'levelComplete') {
    loadLevel(levelIndex+1);
    gameState = 'playing';
    hideOverlay();
  } else if (gameState === 'win') {
    fullReset();
    gameState = 'playing';
    hideOverlay();
  }
});

// initial start screen
showOverlay('Simorgh Platformer', 'Arrow keys / WASD to move, Space or Up to jump (double-jump in air!). Reach the flag, collect gems, avoid enemies. Jump on enemies to defeat them.', 'Start Game');

// ---------- Physics / Update ----------
function updateMovingPlatforms() {
  const t = frame * 0.033;
  level.movingPlatforms.forEach(mp => {
    if (mp.axis === 'x') {
      mp.curX = mp.x + Math.sin(t*mp.speed*0.3 + mp.phase) * mp.range;
      mp.curY = mp.y;
    } else {
      const base = (mp.baseY !== undefined) ? mp.baseY : mp.y;
      mp.curY = base + Math.sin(t*mp.speed*0.3 + mp.phase) * mp.range - mp.range;
      mp.curX = mp.x;
    }
    mp.prevX = mp.prevCurX === undefined ? mp.curX : mp.prevCurX;
    mp.prevY = mp.prevCurY === undefined ? mp.curY : mp.prevCurY;
  });
}

function getAllSolids() {
  const solids = level.platforms.map(p => ({x:p.x,y:p.y,w:p.w,h:p.h, moving:false}));
  level.movingPlatforms.forEach(mp => {
    solids.push({x: mp.curX, y: mp.curY, w: mp.w, h: mp.h, moving:true, mp});
  });
  return solids;
}

function updateEnemies() {
  level.enemies.forEach(en => {
    if (en.dead) return;
    en.x += en.speed * en.dir;
    if (en.x < en.minX) { en.x = en.minX; en.dir = 1; }
    if (en.x + en.w > en.maxX) { en.x = en.maxX - en.w; en.dir = -1; }
  });
}

function updatePlayer() {
  // horizontal movement
  if (left() && !right()) {
    player.vx -= MOVE_ACCEL;
    player.facing = -1;
  } else if (right() && !left()) {
    player.vx += MOVE_ACCEL;
    player.facing = 1;
  } else {
    player.vx *= MOVE_FRICTION;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
  }
  player.vx = Math.max(-MAX_RUN, Math.min(MAX_RUN, player.vx));

  // gravity
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // coyote time bookkeeping
  if (player.onGround) {
    player.coyoteTimer = COYOTE_FRAMES;
    player.airJumpsLeft = AIR_JUMPS_MAX;
  } else if (player.coyoteTimer > 0) {
    player.coyoteTimer--;
  }

  // jump handling (buffered + coyote + double jump)
  if (jumpBufferTimer > 0) {
    let didJump = false;
    if (player.coyoteTimer > 0) {
      player.vy = JUMP_VELOCITY;
      player.coyoteTimer = 0;
      player.onGround = false;
      didJump = true;
    } else if (player.airJumpsLeft > 0) {
      player.vy = JUMP_VELOCITY * 0.92;
      player.airJumpsLeft--;
      didJump = true;
    }
    if (didJump) jumpBufferTimer = 0;
  }
  if (jumpBufferTimer > 0) jumpBufferTimer--;

  // integrate X
  player.x += player.vx;
  player.onGround = false;

  const solids = getAllSolids();

  // horizontal collision
  for (const s of solids) {
    if (rectsOverlap(player, s)) {
      if (player.vx > 0) player.x = s.x - player.w;
      else if (player.vx < 0) player.x = s.x + s.w;
      player.vx = 0;
    }
  }

  // integrate Y
  const prevY = player.y;
  player.y += player.vy;

  for (const s of solids) {
    if (rectsOverlap(player, s)) {
      if (player.vy > 0) {
        // landing on top
        if (prevY + player.h <= s.y + 4) {
          player.y = s.y - player.h;
          player.vy = 0;
          player.onGround = true;
          // carry moving platform velocity
          if (s.moving && s.mp) {
            const mp = s.mp;
            const dx = (mp.curX - (mp.prevX !== undefined ? mp.prevX : mp.curX));
            player.x += dx;
          }
        }
      } else if (player.vy < 0) {
        player.y = s.y + s.h;
        player.vy = 0;
      }
    }
  }

  // bounds
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > level.width) player.x = level.width - player.w;

  // pit fall check
  for (const pit of level.pits) {
    if (player.x + player.w > pit.x && player.x < pit.x + pit.w) {
      if (player.y > H) {
        loseLife();
        return;
      }
    }
  }
  if (player.y > H + 60) {
    loseLife();
    return;
  }

  if (player.invuln > 0) player.invuln--;

  // enemy collisions
  for (const en of level.enemies) {
    if (en.dead) continue;
    if (rectsOverlap(player, en)) {
      // stomp check: player falling and above enemy
      const playerBottom = player.y + player.h;
      const enemyTop = en.y;
      if (player.vy > 0 && playerBottom - player.vy <= enemyTop + 10) {
        en.dead = true;
        en.deadTimer = 20;
        player.vy = JUMP_VELOCITY * 0.6;
        score += 5;
        updateHUD();
      } else {
        loseLife();
        return;
      }
    }
  }

  // coin collisions
  level.coins.forEach((c, i) => {
    if (coinsCollectedThisLevel.has(i)) return;
    const cr = {x:c.x-10, y:c.y-10, w:20, h:20};
    if (rectsOverlap(player, cr)) {
      coinsCollectedThisLevel.add(i);
      score += 1;
      updateHUD();
    }
  });

  // checkpoint update (mid-level checkpoints, if any)
  if (level.checkpoints && level.checkpoints.length > 1) {
    for (const cp of level.checkpoints) {
      if (Math.abs(player.x - cp.x) < 40 && Math.abs(player.y - cp.y) < 100) {
        currentCheckpoint = cp;
      }
    }
  }

  // goal check
  const g = level.goal;
  if (rectsOverlap(player, g)) {
    if (levelIndex >= levels.length - 1) {
      gameState = 'win';
      showOverlay('You Win!', `Congratulations! Final Score: ${score}`, 'Play Again');
    } else {
      gameState = 'levelComplete';
      showOverlay('Level Complete!', `Score so far: ${score}`, 'Next Level');
    }
  }
}

// remove dead enemies after their fade timer
function updateEnemyDeaths() {
  level.enemies.forEach(en => {
    if (en.dead && en.deadTimer > 0) en.deadTimer--;
  });
}

// ---------- Camera ----------
function updateCamera() {
  const targetCamX = player.x - W/2 + player.w/2;
  camX += (targetCamX - camX) * 0.12;
  camX = Math.max(0, Math.min(level.width - W, camX));
}

// ---------- Rendering ----------
function drawBackground() {
  ctx.fillStyle = level.bg;
  ctx.fillRect(0,0,W,H);
  level.parallax.forEach(layer => {
    ctx.fillStyle = layer.color;
    const offset = -(camX * layer.speed) % W;
    ctx.fillRect(offset, layer.y, W, layer.h);
    ctx.fillRect(offset + W, layer.y, W, layer.h);
  });
}

function drawPlatforms() {
  ctx.save();
  ctx.translate(-camX, 0);

  level.platforms.forEach(p => {
    if (p.x + p.w < camX - 50 || p.x > camX + W + 50) return;
    const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y+p.h);
    grad.addColorStop(0, '#6b4423');
    grad.addColorStop(1, '#4a2e18');
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#3f7d34';
    ctx.fillRect(p.x, p.y, p.w, 6);
  });

  level.movingPlatforms.forEach(mp => {
    const x = mp.curX !== undefined ? mp.curX : mp.x;
    const y = mp.curY !== undefined ? mp.curY : mp.y;
    if (x + mp.w < camX - 50 || x > camX + W + 50) return;
    ctx.fillStyle = '#8b6b4a';
    ctx.fillRect(x, y, mp.w, mp.h);
    ctx.strokeStyle = '#5a4530';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, mp.w, mp.h);
  });

  ctx.restore();
}

function drawPits() {
  ctx.save();
  ctx.translate(-camX, 0);
  level.pits.forEach(pit => {
    if (pit.x + pit.w < camX - 50 || pit.x > camX + W + 50) return;
    const grad = ctx.createLinearGradient(pit.x, H-100, pit.x, H);
    grad.addColorStop(0, 'rgba(0,0,0,0.1)');
    grad.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = grad;
    ctx.fillRect(pit.x, H-120, pit.w, 120);
  });
  ctx.restore();
}

function drawCoins() {
  ctx.save();
  ctx.translate(-camX, 0);
  level.coins.forEach((c, i) => {
    if (coinsCollectedThisLevel.has(i)) return;
    if (c.x < camX - 50 || c.x > camX + W + 50) return;
    const bob = Math.sin(frame*0.1 + i) * 3;
    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.rotate(frame*0.05);
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath();
    ctx.moveTo(0,-10); ctx.lineTo(8,0); ctx.lineTo(0,10); ctx.lineTo(-8,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#e0a800';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  });
  ctx.restore();
}

function drawEnemies() {
  ctx.save();
  ctx.translate(-camX, 0);
  level.enemies.forEach(en => {
    if (en.dead && en.deadTimer <= 0) return;
    if (en.x + en.w < camX - 50 || en.x > camX + W + 50) return;
    ctx.save();
    if (en.dead) {
      ctx.globalAlpha = en.deadTimer / 20;
      ctx.translate(en.x + en.w/2, en.y + en.h/2 + (20-en.deadTimer));
      ctx.scale(1, 0.2);
      ctx.translate(-(en.x+en.w/2), -(en.y+en.h/2));
    }
    if (en.type === 'slime') {
      ctx.fillStyle = '#4dd65b';
      const squish = Math.abs(Math.sin(frame*0.15)) * 4;
      ctx.beginPath();
      ctx.ellipse(en.x+en.w/2, en.y+en.h/2+squish/2, en.w/2, en.h/2-squish/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#2a9e38';
      ctx.beginPath();
      ctx.arc(en.x+en.w/2-6, en.y+en.h/2-4, 3, 0, Math.PI*2);
      ctx.arc(en.x+en.w/2+6, en.y+en.h/2-4, 3, 0, Math.PI*2);
      ctx.fill();
    } else if (en.type === 'spike') {
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.moveTo(en.x, en.y+en.h);
      ctx.lineTo(en.x+en.w/2, en.y);
      ctx.lineTo(en.x+en.w, en.y+en.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(en.x+en.w/2-6, en.y+en.h-8, 3, 0, Math.PI*2);
      ctx.arc(en.x+en.w/2+6, en.y+en.h-8, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(en.x+en.w/2-6, en.y+en.h-8, 1.5, 0, Math.PI*2);
      ctx.arc(en.x+en.w/2+6, en.y+en.h-8, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
}

function drawGoal() {
  ctx.save();
  ctx.translate(-camX, 0);
  const g = level.goal;
  ctx.fillStyle = '#888';
  ctx.fillRect(g.x + g.w/2 - 3, g.y, 6, g.h);
  const wave = Math.sin(frame*0.1)*4;
  ctx.fillStyle = '#4ecca3';
  ctx.beginPath();
  ctx.moveTo(g.x + g.w/2 + 3, g.y);
  ctx.lineTo(g.x + g.w/2 + 3 + 30 + wave, g.y+12);
  ctx.lineTo(g.x + g.w/2 + 3, g.y+24);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  ctx.translate(-camX, 0);
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.scale(player.facing, 1);

  if (player.invuln > 0 && Math.floor(player.invuln/4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  // body
  ctx.fillStyle = '#3d5afe';
  ctx.beginPath();
  ctx.roundRect(-player.w/2, -player.h/2, player.w, player.h, 6);
  ctx.fill();

  // face
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(6, -8, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(7.5, -8, 1.8, 0, Math.PI*2);
  ctx.fill();

  // legs animation
  const moving = Math.abs(player.vx) > 0.3 && player.onGround;
  const legOffset = moving ? Math.sin(frame*0.3)*6 : 0;
  ctx.fillStyle = '#2c3ec2';
  ctx.fillRect(-player.w/2+4, player.h/2-6, 8, 8 + legOffset*0.3);
  ctx.fillRect(player.w/2-12, player.h/2-6, 8, 8 - legOffset*0.3);

  ctx.restore();
  ctx.restore();
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    this.beginPath();
    this.moveTo(x+r, y);
    this.arcTo(x+w, y, x+w, y+h, r);
    this.arcTo(x+w, y+h, x, y+h, r);
    this.arcTo(x, y+h, x, y, r);
    this.arcTo(x, y, x+w, y, r);
    this.closePath();
  };
}

function drawBanner() {
  if (bannerTimer > 0) {
    bannerTimer--;
    if (bannerTimer <= 0) {
      document.getElementById('levelBanner').classList.remove('show');
    }
  }
}

// ---------- Main Loop ----------
function loop() {
  frame++;

  if (gameState === 'playing') {
    updateMovingPlatforms();
    updateEnemies();
    updatePlayer();
    updateEnemyDeaths();
    updateCamera();
  }
  jumpPressedThisFrame = false;

  drawBackground();
  drawPits();
  drawPlatforms();
  drawCoins();
  drawEnemies();
  drawGoal();
  drawPlayer();
  drawBanner();

  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
