<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Simorgh</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--fg:#f2f4f9;--dim:#b3b9c6;--faint:#828a99;--warm:#f0bd83;--gold:#f7d29b;--green:#84e6a6;--cyan:#9fe3ff;--red:#ff9a94;--violet:#c9a9ff;
--stroke:rgba(255,255,255,.20);--stroke2:rgba(255,255,255,.10);--radius:24px;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#06060b;color:var(--fg);overflow:hidden;
font-family:"SF Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.45;}
#bg,#bg2{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 1.4s ease;}
#bg2{opacity:0;}
#scrim{position:fixed;inset:0;pointer-events:none;
background:radial-gradient(120% 120% at 50% 40%,transparent 40%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.45));}
#app{position:relative;height:100vh;display:flex;flex-direction:column;padding:18px;gap:14px;}
.glass{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 55%,rgba(255,255,255,.02));
backdrop-filter:blur(42px) saturate(180%);-webkit-backdrop-filter:blur(42px) saturate(180%);
border:1px solid var(--stroke);border-radius:var(--radius);
box-shadow:0 22px 55px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05);overflow:hidden;}
.glass::before{content:"";position:absolute;top:0;left:0;right:40%;height:42%;pointer-events:none;
background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 75%);opacity:.7;}
.dim{color:var(--dim);}.faint{color:var(--faint);}.warm{color:var(--warm);}.gold{color:var(--gold);}
.green{color:var(--green);}.cyan{color:var(--cyan);}.red{color:var(--red);}.violet{color:var(--violet);}
.hd{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);}
.tag{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);border:1px solid var(--stroke2);border-radius:6px;padding:1px 6px;}
#bar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:16px;}
#dock{display:flex;gap:7px;}
.dot{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
background:rgba(255,255,255,.09);border:1px solid var(--stroke2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:.2s;}
.dot.on{background:rgba(240,189,131,.24);border-color:rgba(240,189,131,.6);}
.dot svg{stroke:var(--dim);} .dot.on svg{stroke:var(--gold);}
#stage{flex:1;min-height:0;}
.grid{display:grid;gap:14px;height:100%;min-height:0;}
.card{padding:14px;min-width:0;min-height:0;overflow:hidden;}
.rowitem{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--stroke2);font-size:13px;line-height:1.35;}
.chart{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--stroke2);}
.thumb{border-radius:14px;overflow:hidden;background-size:cover;background-position:center;position:relative;border:1px solid var(--stroke2);}
.thumb .cap{position:absolute;left:12px;right:12px;bottom:10px;font-size:13px;text-shadow:0 1px 6px #000;}
.thumb .scr{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,0,0,.66));}
a{color:var(--warm);}
</style></head>
<body>
<div id="bg"></div><div id="bg2"></div><div id="scrim"></div>
<div id="app">
  <div id="bar" class="glass">
    <div style="display:flex;align-items:center;gap:12px;"><span class="warm" id="spark" style="font-size:17px;">✻</span>
      <span style="font-size:15px;letter-spacing:.5px;">Simorgh</span><span class="faint">·</span><span class="dim" id="viewname">Home</span></div>
    <div id="dock"></div>
    <div style="display:flex;align-items:center;gap:14px;font-size:12px;">
      <span class="green" id="net">● online</span><span class="gold" id="clock" style="font-size:15px;">--:--</span>
      <span class="dim" id="date"></span></div>
  </div>
  <div id="stage"></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ICONS={deck:'<path d="M3 9.5 10 3l7 6.5M5 8.2V16h4v-4h2v4h4V8.2"/>',discover:'<circle cx="10" cy="10" r="7.2"/><path d="M10 4.6l1.5 3.9 3.9 1.5-3.9 1.5L10 15.4 8.5 11.5 4.6 10l3.9-1.5z"/>',cameras:'<rect x="2.5" y="5.5" width="10" height="9" rx="1.6"/><path d="M12.5 8.5l5-2.5v8l-5-2.5z"/>',news:'<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M5.5 7h6M5.5 10h9M5.5 13h9"/>',markets:'<path d="M3 15.5V4.5M3 15.5h13.5"/><path d="M6 12l3-3 2.5 2L16 6"/>',media:'<circle cx="10" cy="10" r="7"/><path d="M8.5 7l4.5 3-4.5 3z"/>',terminal:'<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M6 8l3 2.5L6 13M11 13h3"/>',ambient:'<circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/>'};
const VIEWS=[["deck","Home"],["discover","Discover"],["cameras","Cameras"],["news","News"],["markets","Markets"],["media","Media"],["terminal","Terminal"],["ambient","Ambient"]];

// ---- wallpapers ----
let WP=[],wpi=0,bgFlip=false;
async function loadWP(){try{const r=await fetch("/api/wallpapers");WP=(await r.json()).wallpapers||[];shuffle(WP);}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function wpUrl(n){return "/wallpapers/"+encodeURIComponent(n);}
function nextWP(){ if(!WP.length) return null; wpi=(wpi+1)%WP.length; return WP[wpi]; }
function setBG(name){ if(!name) return; const show=bgFlip?$("#bg"):$("#bg2"),hide=bgFlip?$("#bg2"):$("#bg");
  const img=new Image(); img.onload=()=>{show.style.backgroundImage=`url("${wpUrl(name)}")`;show.style.opacity=1;hide.style.opacity=0;bgFlip=!bgFlip;}; img.src=wpUrl(name);}
function randWP(){ return WP.length? WP[Math.floor(Math.random()*WP.length)] : null; }

// ---- content data (placeholder until Sim's collector fills it) ----
const JOKES=["Why did the scarecrow win an award? He was outstanding in his field.","What do you call cheese that isn't yours? Nacho cheese.","Why can't a bicycle stand up by itself? It's two-tired.","What did the ocean say to the beach? Nothing — it just waved.","Why did the math book look sad? Too many problems.","What do you call a bear with no teeth? A gummy bear."];
const SCHED=[["gold","7:00a","Trash & recycling out",""],["cyan","8:15a","Aria — school drop-off","Lincoln Elementary"],["cyan","8:40a","Kian — school drop-off","Harker Middle"],["green","1:00p","Lunch: taco bar 🌮","cafeteria"],["violet","3:20p","Aria — soccer","field 4"],["warm","6:30p","Dinner reservation","Namsan · 2"]];
const SONGS=[["1","Golden Hour","JVKE","▲"],["2","Espresso","S. Carpenter","–"],["3","Birds of a Feather","Billie Eilish","▲"],["4","Not Like Us","K. Lamar","▼"],["5","Good Luck, Babe!","C. Roan","▲"]];
const MOVIES=[["1","Dune: Part Three","$92M wknd","▲"],["2","Zootopia 2","$54M","▲"],["3","Avatar 3","$38M","▼"],["4","The Batman II","$21M","–"],["5","Inside Out 3","$14M","▼"]];
const TICK=[["S&P","5,842","+0.5%","green"],["NASDAQ","20,140","+0.8%","green"],["DOW","43,110","-0.2%","red"],["NVDA","1,204","+2.4%","green"],["AAPL","236","-0.6%","red"],["BTC","98,240","+3.7%","green"],["Oil","$79.4","-1.1%","red"],["Gold","$2,610","+0.3%","green"]];
const CATS={World:[["gold","Climate finance deal reached at global summit","Reuters"],["gold","Ceasefire holds a third day along disputed border","AP"],["gold","Record monsoon displaces thousands","BBC"]],
Technology:[["cyan","Open model tops coding benchmarks","Verge"],["cyan","2nm chips announced for 2027","Ars"],["cyan","Robotaxis expand to three cities","TC"]],
Business:[["green","Futures up before jobs report","CNBC"],["green","Oil slips below $80","WSJ"],["green","Gold steady near record","FT"]],
Science:[["violet","Asteroid samples hint at early water","Nature"],["violet","Fusion plasma sustained a record 8 min","IEEE"],["violet","Malaria vaccine v2 shows promise","STAT"]]};
const CAMS=["Front Door","Driveway","Backyard","Garage","Pool","Side Gate"];

// ---- live state ----
let ACT=[],STATUS={};
async function poll(){
  try{const a=await (await fetch("/api/activity?limit=40")).json();ACT=(a.events||[]).slice().reverse();$("#net").innerHTML=(a.pending_turns||[]).length?'<span class="warm">✻ thinking</span>':'<span class="green">● online</span>';}catch(e){}
  try{STATUS=await (await fetch("/api/status")).json();}catch(e){}
  if(CUR==="deck"||CUR==="terminal"||CUR==="news") render();
}
function actLine(e){const t=e.type||"",s=esc(e.summary||"");
  if(t==="percept.text.received")return '<div style="color:#dfe3ea;">❯ '+s+'</div>';
  if(t==="turn.completed")return '<div>● '+s+'</div>';
  if(t==="task.started")return '<div class="warm">⏺ '+esc(e.kind||"task")+' · '+s+'</div>';
  if(t==="task.completed")return '<div class="green">&nbsp;&nbsp;⎿ ✅ '+s+'</div>';
  if(t==="task.failed"||t==="task.blocked")return '<div class="red">&nbsp;&nbsp;⎿ '+t.split(".")[1]+' '+s+'</div>';
  if(t==="action.result")return '<div class="dim">&nbsp;&nbsp;⏺ '+esc(e.tool||"tool")+' '+(e.ok===false?"✗":"✓")+' '+s+'</div>';
  return '<div class="dim">'+s+'</div>';}
function termHTML(big){
  const lines=ACT.length?ACT.map(actLine).join(""):'<div class="dim">Sim is idle. Say “Sim”, or pick a view.</div>';
  const fs=big?'15px':'13px';
  return '<div style="font-size:'+fs+';line-height:1.55;height:100%;display:flex;flex-direction:column;overflow:hidden;">'
   +'<div style="flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;">'+lines+'</div>'
   +'<div style="border-top:1px solid var(--stroke2);margin-top:9px;padding-top:9px;">'
   +'<span style="color:#dfe3ea;">❯</span> <span class="faint">'+( (STATUS.model?esc(STATUS.model)+' · ':'')+'ask, or say a view name…')+'</span></div></div>';
}

// ---- builders ----
function head(t,tag){return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span class="hd">'+t+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';}
function rows(items){return items.map(([c,t,s])=>'<div class="rowitem"><span class="'+c+'">•</span><div>'+esc(t)+(s?' <span class="faint" style="font-size:11px;">· '+esc(s)+'</span>':'')+'</div></div>').join("");}
function chartrows(items){return items.map(([r,t,s,v])=>'<div class="chart"><span class="gold" style="width:14px;text-align:center;">'+r+'</span><div style="flex:1;min-width:0;"><div style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(t)+'</div><div class="faint" style="font-size:10.5px;">'+esc(s)+'</div></div><span class="dim">'+v+'</span></div>').join("");}
function schedrows(){return SCHED.map(([c,tm,t,s])=>'<div class="rowitem"><span class="'+c+'" style="flex:none;">'+tm+'</span><div>'+esc(t)+(s?' <span class="faint" style="font-size:11px;">· '+esc(s)+'</span>':'')+'</div></div>').join("");}
function thumb(cap,tag,h){return '<div class="thumb" style="height:'+(h||'100%')+';background-image:url(\''+wpUrl(randWP()||"")+'\');"><div class="scr"></div>'+(tag?'<div class="tag" style="position:absolute;right:9px;top:8px;">'+tag+'</div>':'')+'<div class="cap">'+cap+'</div></div>';}

function miniWatch(){return STOCKS.slice(0,5).map(([sym,name,desc,base])=>{const pp=series(sym,"1M"),ch=pct(pp),up=ch>=0;
  return '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--stroke2);font-size:11.5px;">'
   +'<span style="width:44px;">'+sym+'</span>'+spark(pp,up?"#84e6a6":"#ff9a94",56,18)
   +'<span style="flex:1;text-align:right;">$'+base.toLocaleString()+'</span><span class="'+(up?"green":"red")+'" style="width:52px;text-align:right;">'+(up?"+":"")+ch.toFixed(1)+'%</span></div>';}).join("");}
function viewDeck(){
  const A=('"clock clock weath weath term term term term cam cam watch watch"'
    +'"sched sched news news term term term term cam cam watch watch"'
    +'"sched sched news news world world sci sci photo photo charts charts"'
    +'"joke joke ent ent world world sci sci photo photo charts charts"'
    +'"media media media reel reel events events events tick tick tick tick"');
  const C=(a,inner,pad)=>'<div class="glass" style="grid-area:'+a+';padding:'+(pad==null?11:pad)+'px;min-width:0;min-height:0;overflow:hidden;">'+inner+'</div>';
  const clock='<div class="hd">Good evening</div><div style="font-size:40px;font-weight:200;line-height:1.05;">'+nowT()+'</div><div class="dim" style="font-size:11px;">'+nowD()+'</div>';
  const weath='<div class="hd">San Jose</div><div style="font-size:30px;font-weight:300;">72°</div><div class="faint" style="font-size:10.5px;">Clear · feels 70°</div>';
  const term='<div style="display:flex;flex-direction:column;height:100%;">'+head("Sim","live")+'<div style="flex:1;min-height:0;">'+termHTML()+'</div></div>';
  const cam='<div style="display:flex;flex-direction:column;height:100%;">'+head("Front Door","live")+'<div style="flex:1;min-height:0;">'+thumb("Front Door","")+'</div></div>';
  const watch='<div style="display:flex;flex-direction:column;height:100%;">'+head("Markets","watchlist")+miniWatch()+'</div>';
  const sched='<div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">'+head("Today")+schedrows()+'</div>';
  const smallrows=items=>items.map(([c,t,src])=>'<div class="rowitem" style="padding:4px 0;font-size:11.5px;"><span class="'+c+'">•</span><div style="min-width:0;">'+esc(t)+'</div></div>').join("");
  const news=head("Technology")+smallrows(CATS.Technology);
  const world=head("World")+smallrows(CATS.World);
  const sci=head("Science")+smallrows(CATS.Science);
  const ent=head("Entertainment")+smallrows([["violet","Dune 3 teaser drops Friday"],["violet","Grammy nominations revealed"]]);
  const photo='<div style="display:flex;flex-direction:column;height:100%;">'+head("Photo of the day")+'<div style="flex:1;min-height:0;">'+thumb("from your gallery","daily")+'</div></div>';
  const charts=head("Charts","top 3")+'<div class="faint" style="font-size:9.5px;margin-bottom:2px;">MUSIC</div>'
    +SONGS.slice(0,3).map(x=>'<div style="font-size:11px;padding:2px 0;"><span class="gold">'+x[0]+'</span> '+esc(x[1])+'</div>').join("")
    +'<div class="faint" style="font-size:9.5px;margin:4px 0 2px;">BOX OFFICE</div>'
    +MOVIES.slice(0,3).map(x=>'<div style="font-size:11px;padding:2px 0;"><span class="gold">'+x[0]+'</span> '+esc(x[1])+'</div>').join("");
  const joke=head("Joke","for Kian")+'<div style="font-size:12.5px;line-height:1.4;">'+esc(JOKES[0])+'</div>';
  const media='<div style="display:flex;gap:9px;height:100%;align-items:center;">'+'<div style="width:88px;height:100%;">'+thumb("","LIVE").replace('class="cap"','class="cap" style="display:none"')+'</div><div style="min-width:0;"><div class="hd">Now playing</div><div style="font-size:12.5px;margin-top:3px;">Planet Earth III</div><div class="faint" style="font-size:10.5px;">casting to Family Room TV</div></div></div>';
  const reel='<div style="display:flex;flex-direction:column;height:100%;">'+head("Trending")+'<div style="flex:1;min-height:0;">'+thumb("▶ 2.4M","reel")+'</div></div>';
  const events=head("Cameras","events")+smallrows([["red","Front Door · person · 9:38p"],["gold","Side Gate · motion · 9:31p"],["green","Backyard · all clear · 9:20p"]]);
  const tick='<div style="display:flex;align-items:center;gap:18px;height:100%;font-size:11.5px;overflow:hidden;"><span class="hd" style="flex:none;">Markets</span>'+TICK.map(([sy,pr,c,col])=>'<span style="flex:none;">'+sy+' <span style="color:var(--fg);">'+pr+'</span> <span class="'+col+'">'+c+'</span></span>').join("")+'</div>';
  return '<div class="grid" style="grid-template-columns:repeat(12,1fr);grid-template-rows:1.05fr 1fr 1fr 1fr .8fr;grid-template-areas:'+A+';gap:12px;">'
    +C("clock",clock)+C("weath",weath)+C("term",term)+C("cam",cam)+C("watch",watch)+C("sched",sched)
    +C("news",news)+C("world",world)+C("sci",sci)+C("ent",ent)+C("photo",photo)+C("charts",charts)
    +C("joke",joke)+C("media",media)+C("reel",reel)+C("events",events)
    +'<div class="glass" style="grid-area:tick;padding:0 14px;min-width:0;overflow:hidden;">'+tick+'</div></div>';
}
function viewDiscover(){
  const A='"world world holly holly photo photo" "world world holly holly photo photo" "sci sci local local photo photo" "movie movie music music jokes jokes" "movie movie music music short short"';
  const C=(a,inner)=>'<div class="glass card" style="grid-area:'+a+';">'+inner+'</div>';
  const world=head("World","6 stories")+rows(CATS.World.map(x=>[x[0],x[1],x[2]]));
  const holly=head("Hollywood & Entertainment","trending")+rows([["violet","Dune 3 wraps reshoots; teaser Friday","Variety"],["violet","A24 lands festival darling in $20M deal","Deadline"],["violet","Two streamers announce a merger","THR"],["violet","Grammy nominations revealed","Billboard"]]);
  const photo='<div style="display:flex;flex-direction:column;height:100%;">'+head("Photo of the day","from your gallery")+'<div style="flex:1;min-height:0;">'+thumb('a favourite from images/wallpapers','')+'</div></div>';
  const sci=head("Science")+rows(CATS.Science.map(x=>[x[0],x[1],x[2]]));
  const local=head("San Jose")+rows([["green","Downtown street festival Sat, 11–6","Mercury News"],["green","101 north lanes reopen","511.org"]]);
  const movie='<div style="display:flex;flex-direction:column;height:100%;">'+head("Top movies","sample")+chartrows(MOVIES.concat([["6","Wednesday S2","Netflix","▲"]]))+'</div>';
  const music='<div style="display:flex;flex-direction:column;height:100%;">'+head("Top music","sample")+chartrows(SONGS.concat([["6","Too Sweet — Hozier","alt","▼"]]))+'</div>';
  const jokes=head("Jokes","family")+JOKES.slice(1,4).map(j=>'<div style="font-size:12.5px;line-height:1.4;padding:4px 0;border-bottom:1px solid var(--stroke2);">'+esc(j)+'</div>').join("");
  const short=head("Trending short")+'<div style="display:flex;gap:11px;align-items:center;height:calc(100% - 22px);">'+thumb('','',null).replace('class="cap"','class="cap" style="display:none"').replace('height:100%','height:100%;width:72px;flex:none;')+'<div><div style="font-size:12.5px;">Golden hour timelapse</div><div class="faint" style="font-size:10.5px;margin-top:3px;">YouTube Shorts · 2.4M · 18h</div></div></div>';
  return '<div class="grid" style="grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);grid-template-areas:'+A+';">'+C('world',world)+C('holly',holly)+C('photo',photo)+C('sci',sci)+C('local',local)+C('movie',movie)+C('music',music)+C('jokes',jokes)+C('short',short)+'</div>';
}
function viewCameras(){
  const tiles=CAMS.map(n=>'<div class="glass" style="padding:0;overflow:hidden;">'+thumb(n,'live')+'</div>').join("");
  const feed='<div class="glass" style="flex:1;padding:14px;overflow:hidden;">'+head("Events","live")+rows([["red","Front Door · person","9:38p"],["gold","Side Gate · motion","9:31p"],["green","Backyard · all clear","9:20p"],["gold","Driveway · vehicle","8:52p"]].map(x=>[x[0],x[1],x[2]]))+'</div>';
  return '<div style="display:flex;gap:14px;height:100%;"><div class="grid" style="flex:2;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);">'+tiles+'</div>'+feed+'</div>';
}
function viewNews(){
  const cards=Object.entries(CATS).map(([k,v])=>'<div class="glass card">'+head(k)+rows(v.map(x=>[x[0],x[1],x[2]]))+'</div>').join("");
  return '<div style="display:flex;gap:14px;height:100%;"><div class="glass card" style="flex:1;display:flex;">'+termHTML()+'</div><div class="grid" style="flex:2.2;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;">'+cards+'</div></div>';
}
const STOCKS=[
["NVDA","NVIDIA","AI infrastructure & graphics chip leader",1204,1],
["AAPL","Apple","Consumer electronics, software & digital services",236,0],
["MSFT","Microsoft","Cloud computing, enterprise software & AI",458,1],
["GOOGL","Alphabet","Search, cloud services & AI platforms",178,1],
["AVGO","Broadcom","Semiconductor & infrastructure software",172,1],
["AMZN","Amazon","E-commerce & AWS cloud computing",201,1],
["META","Meta Platforms","Social networks & advertising technology",574,1],
["MU","Micron","Memory & storage technology",108,0],
["AMD","AMD","Processors, graphics & adaptive computing",162,0],
["INTC","Intel","Semiconductor manufacturing & processor design",23,-1],
["CSCO","Cisco","Networking hardware & telecom equipment",58,0],

["TXN","Texas Instruments","Analog & embedded processing chips",205,0],
["QCOM","Qualcomm","Wireless technology & mobile processors",168,0]];

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function series(sym,tf){const st=STOCKS.find(x=>x[0]===sym)||STOCKS[0];const base=st[3],bias=st[4];
  const n={"1D":26,"1W":30,"1M":34,"1Y":54}[tf]||34;const rnd=mulberry(hash(sym+tf));
  const vol=base*({"1D":.006,"1W":.02,"1M":.05,"1Y":.22}[tf]||.05);let v=base*(1-bias*({"1D":.004,"1W":.01,"1M":.03,"1Y":.14}[tf]||.03));
  const out=[];for(let i=0;i<n;i++){v+=(rnd()-0.5)*vol+bias*vol*0.18;v=Math.max(base*0.4,v);out.push(v);}
  out[out.length-1]=base;return out;}
function spark(pts,col,w=84,h=26){const mx=Math.max(...pts),mn=Math.min(...pts),rg=(mx-mn)||1,stp=w/(pts.length-1);
  const ln=pts.map((v,i)=>(i*stp).toFixed(0)+","+(h-2-((v-mn)/rg)*(h-4)).toFixed(0)).join(" ");
  return '<svg width="'+w+'" height="'+h+'"><polyline points="'+ln+'" fill="none" stroke="'+col+'" stroke-width="1.5"/></svg>';}
function pct(pts){return (pts[pts.length-1]-pts[0])/pts[0]*100;}
window.selStock=s=>{SEL=s;render();};window.selTF=t=>{TF=t;render();};
function viewMarkets(){
  const watchInner=STOCKS.map(([sym,name,desc,base])=>{const p=series(sym,"1M"),ch=pct(p),up=ch>=0,col=up?"#84e6a6":"#ff9a94";
    return '<div onclick="selStock(&quot;'+sym+'&quot;)" style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--stroke2);cursor:pointer;border-radius:8px;'+(sym===SEL?"background:rgba(240,189,131,.14);":"")+'">'
      +'<div style="width:52px;"><div style="font-size:12.5px;">'+sym+'</div><div class="faint" style="font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:50px;">'+esc(name)+'</div></div>'
      +spark(p,col)+'<div style="text-align:right;flex:1;"><div style="font-size:12px;">$'+base.toLocaleString()+'</div><div class="'+(up?"green":"red")+'" style="font-size:10.5px;">'+(up?"+":"")+ch.toFixed(1)+'%</div></div></div>';}).join("");
  const watch='<div class="glass card" style="flex:1;overflow-y:auto;">'+head("Watchlist","15")+watchInner+'</div>';
  const st=STOCKS.find(x=>x[0]===SEL)||STOCKS[0];const pts=series(SEL,TF);const ch=pct(pts),up=ch>=0;const last=pts[pts.length-1];
  const w=560,h=300,mx=Math.max(...pts),mn=Math.min(...pts),rg=(mx-mn)||1,stp=w/(pts.length-1);
  const xy=pts.map((v,i)=>[i*stp,h-24-((v-mn)/rg)*(h-56)]);const ln=xy.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const col=up?"#84e6a6":"#ff9a94";const grid=[0,1,2,3,4].map(i=>'<line x1="0" y1="'+(h-24-i*(h-56)/4).toFixed(0)+'" x2="'+w+'" y2="'+(h-24-i*(h-56)/4).toFixed(0)+'" stroke="rgba(255,255,255,.06)"/>').join("");
  const labels=[0,1,2,3,4].map(i=>{const val=mn+rg*i/4;return '<text x="'+(w-2)+'" y="'+(h-24-i*(h-56)/4-3).toFixed(0)+'" fill="#828a99" font-size="9" text-anchor="end">'+val.toFixed(val>500?0:1)+'</text>';}).join("");
  const chart='<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+grid+'<polygon points="0,'+(h-24)+' '+ln+' '+w+','+(h-24)+'" fill="'+col+'" opacity=".13"/><polyline points="'+ln+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+labels+'</svg>';
  const pills=["1D","1W","1M","1Y"].map(t=>'<span onclick="selTF(&quot;'+t+'&quot;)" style="cursor:pointer;padding:4px 11px;border-radius:8px;border:1px solid var(--stroke2);'+(t===TF?"background:rgba(240,189,131,.22);color:var(--gold);":"color:var(--dim);")+'">'+t+'</span>').join("");
  const rnd=mulberry(hash(SEL));const o=(last*(0.99+rnd()*0.01)),hi=last*(1.005+rnd()*0.01),lo=last*(0.985+rnd()*0.008),vol=(20+rnd()*60);
  const mid='<div class="glass card" style="flex:2.2;display:flex;flex-direction:column;">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
    +'<div><div style="font-size:22px;">'+esc(st[1])+' · '+SEL+'</div>'
    +'<div class="'+(up?"green":"red")+'" style="font-size:14px;">$'+last.toLocaleString(undefined,{maximumFractionDigits:2})+'  '+(up?"+":"")+ch.toFixed(2)+'% ('+TF+')</div></div>'
    +'<div style="display:flex;gap:7px;font-size:11px;">'+pills+'</div></div>'
    +'<div class="faint" style="font-size:11.5px;margin:6px 0 4px;">'+esc(st[2])+'</div>'
    +'<div style="flex:1;min-height:0;display:flex;align-items:center;">'+chart+'</div>'
    +'<div style="display:flex;gap:20px;margin-top:4px;font-size:11px;" class="dim"><span>O '+o.toFixed(1)+'</span><span>H '+hi.toFixed(1)+'</span><span>L '+lo.toFixed(1)+'</span><span>Vol '+vol.toFixed(1)+'M</span><span class="faint">sample series</span></div></div>';
  const idx='<div class="glass card" style="flex:1;">'+head("Indices")+[["S&P 500","5,842 +0.5%","green"],["Nasdaq","20,140 +0.8%","green"],["Dow","43,110 -0.2%","red"],["VIX","13.4 -3.1%","green"],["10Y","4.18%","dim"]].map(x=>'<div class="rowitem" style="justify-content:space-between;"><span>'+x[0]+'</span><span class="'+x[2]+'">'+x[1]+'</span></div>').join("")+'</div>';
  return '<div style="display:flex;gap:14px;height:100%;">'+watch+mid+idx+'</div>';
}
function viewMedia(){
  const now='<div class="glass" style="flex:2;padding:0;overflow:hidden;display:flex;flex-direction:column;"><div style="flex:1;min-height:0;">'+thumb('Planet Earth III · “Deserts”','LIVE 4K')+'</div><div style="padding:13px 16px;font-size:14px;">Planet Earth III · “Deserts” <span class="faint" style="font-size:11px;">· casting to Family Room TV</span></div></div>';
  const up='<div class="glass card" style="flex:1;">'+head("Up next")+[["Blue Planet II","YouTube · 50m"],["Cosmos","Disney+ · 44m"],["Chef's Table","Netflix · 41m"],["Lo-fi beats","YouTube · live"]].map(x=>'<div class="rowitem"><div>'+x[0]+' <span class="faint" style="font-size:11px;">· '+x[1]+'</span></div></div>').join("")+'</div>';
  return '<div style="display:flex;gap:14px;height:100%;">'+now+up+'</div>';
}
function viewTerminal(){return '<div class="glass card" style="height:100%;display:flex;">'+termHTML(true)+'</div>';}
function viewAmbient(){
  return '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">'
    +'<div style="font-size:150px;font-weight:200;letter-spacing:2px;text-shadow:0 4px 44px rgba(0,0,0,.5);">'+nowT()+'</div>'
    +'<div class="dim" style="font-size:22px;">'+nowD()+'</div>'
    +'<div style="display:flex;gap:14px;margin-top:24px;">'
    +'<div class="glass" style="padding:16px 22px;text-align:center;"><div style="font-size:30px;">72°</div><div class="faint" style="font-size:11px;">Clear</div></div>'
    +'<div class="glass" style="padding:16px 22px;text-align:center;"><div class="hd">Next</div><div style="font-size:15px;margin-top:5px;">Aria · school</div><div class="faint" style="font-size:11px;">8:15 AM</div></div>'
    +'<div class="glass" style="padding:16px 22px;text-align:center;"><div class="hd">Home</div><div class="green" style="font-size:15px;margin-top:5px;">all secure</div></div></div></div>';
}
const RENDER={deck:viewDeck,discover:viewDiscover,cameras:viewCameras,news:viewNews,markets:viewMarkets,media:viewMedia,terminal:viewTerminal,ambient:viewAmbient};

// ---- time ----
function nowT(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0");}
function nowD(){return new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}

// ---- app ----
let CUR="deck";
function buildDock(){$("#dock").innerHTML=VIEWS.map(([k,n])=>'<div class="dot'+(k===CUR?" on":"")+'" data-k="'+k+'" title="'+n+'"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg></div>').join("");
  $("#dock").querySelectorAll(".dot").forEach(d=>d.onclick=()=>go(d.dataset.k));}
function render(){$("#stage").innerHTML=(RENDER[CUR]||viewDeck)();}
function go(k){CUR=k;$("#viewname").textContent=(VIEWS.find(v=>v[0]===k)||[,"Home"])[1];buildDock();render();setBG(randWP());}
function tickClock(){$("#clock").textContent=nowT();$("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}

(async function(){await loadWP();setBG(WP[0]);buildDock();render();tickClock();
  setInterval(tickClock,1000);
  let s=0;setInterval(()=>{s=(s+1)%6;$("#spark").textContent="·+✶✻✶+"[s];},300);
  setInterval(()=>setBG(nextWP()),45000);   // rotate wallpaper
  poll();setInterval(poll,4000);
})();
</script></body></html>
