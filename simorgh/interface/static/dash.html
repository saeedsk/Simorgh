<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Simorgh</title><link rel="icon" type="image/png" href="/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--fg:#f2f4f9;--dim:#b3b9c6;--faint:#828a99;--warm:#f0bd83;--gold:#f7d29b;--amber:#ffb347;--green:#84e6a6;--cyan:#9fe3ff;--red:#ff9a94;--violet:#c9a9ff;
--stroke:rgba(255,255,255,.20);--stroke2:rgba(255,255,255,.10);--radius:22px;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#06060b;color:var(--fg);overflow:hidden;
font-family:"SF Mono","SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;}
#bg,#bg2{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 1.4s ease;}
#bg2{opacity:0;}
#scrim{position:fixed;inset:0;pointer-events:none;
background:radial-gradient(120% 120% at 50% 40%,transparent 40%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.45));}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;padding:16px;gap:12px;transform-origin:0 0;}
.glass{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 55%,rgba(255,255,255,.01)),rgba(10,10,16,.34);
backdrop-filter:blur(42px) saturate(180%);-webkit-backdrop-filter:blur(42px) saturate(180%);
border:1px solid var(--stroke);border-radius:var(--radius);
box-shadow:0 22px 55px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05);overflow:hidden;}
.glass::before{content:"";position:absolute;top:0;left:0;right:40%;height:42%;pointer-events:none;
background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 75%);opacity:.7;}
.dark{background:linear-gradient(160deg,rgba(8,8,14,.72),rgba(8,8,14,.55));}
.dim{color:var(--dim);}.faint{color:var(--faint);}.warm{color:var(--warm);}.gold{color:var(--gold);}.amber{color:var(--amber);}
.green{color:var(--green);}.cyan{color:var(--cyan);}.red{color:var(--red);}.violet{color:var(--violet);}
.hd{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);}
.hd.bb{color:var(--amber);}
.tag{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);border:1px solid var(--stroke2);border-radius:6px;padding:1px 6px;white-space:nowrap;}
#bar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:16px;}
#dock{display:flex;gap:7px;}
.dot{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;
background:rgba(255,255,255,.09);border:1px solid var(--stroke2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:.2s;}
.dot.on{background:rgba(240,189,131,.24);border-color:rgba(240,189,131,.6);}
.dot svg{stroke:var(--dim);} .dot.on svg{stroke:var(--gold);}
#stage{flex:1;min-height:0;}
.grid{display:grid;gap:12px;height:100%;min-height:0;}
.card{padding:13px;min-width:0;min-height:0;overflow:hidden;}
.col{display:flex;flex-direction:column;height:100%;min-height:0;}
.fill{flex:1;min-height:0;overflow:hidden;}
.rowitem{display:flex;gap:9px;padding:4px 0;border-bottom:1px solid var(--stroke2);font-size:11.5px;line-height:1.35;}
.rowitem:last-child{border-bottom:none;}
.rowitem .t{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.rowitem .m{flex:none;color:var(--faint);font-size:10.5px;}
.tr{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--stroke2);font-size:11px;white-space:nowrap;}
.tr:last-child{border-bottom:none;}
.tr .l{color:var(--dim);overflow:hidden;text-overflow:ellipsis;min-width:0;}
.thumb{border-radius:14px;overflow:hidden;background-size:cover;background-position:center;position:relative;border:1px solid var(--stroke2);height:100%;}
.thumb .cap{position:absolute;left:12px;right:12px;bottom:10px;font-size:12.5px;text-shadow:0 1px 6px #000;line-height:1.3;}
.thumb .scr{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72));}
.thumb .tag{position:absolute;right:9px;top:8px;background:rgba(0,0,0,.35);}
.clamp{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;}
.ch{position:relative;width:100%;height:100%;min-height:0;}
.ch svg{position:absolute;inset:0;width:100%;height:100%;}
.ch .yl{position:absolute;right:4px;font-size:9.5px;color:var(--faint);transform:translateY(-50%);text-shadow:0 1px 3px #000;}
.ch .xl{position:absolute;bottom:0;font-size:9.5px;color:var(--faint);transform:translateX(-50%);}
.pill{cursor:pointer;padding:3px 10px;border-radius:8px;border:1px solid var(--stroke2);color:var(--dim);font-size:11px;}
.pill.on{background:rgba(255,179,71,.22);color:var(--amber);border-color:rgba(255,179,71,.5);}
.tile{cursor:pointer;transition:border-color .2s;}
.tile.on{border-color:rgba(255,179,71,.6);}
.marquee{display:flex;align-items:center;height:100%;overflow:hidden;white-space:nowrap;}
.marquee .track{display:inline-flex;gap:28px;padding-left:100%;animation:mq var(--mqs,60s) linear infinite;}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.art{width:34px;height:34px;border-radius:7px;background-size:cover;background-position:center;flex:none;background-color:rgba(255,255,255,.06);}
.big{font-weight:200;line-height:1.02;letter-spacing:-.5px;}
.range{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin:5px 0 2px;}
.range i{position:absolute;top:-3px;width:10px;height:10px;border-radius:5px;background:var(--amber);transform:translateX(-50%);box-shadow:0 0 6px rgba(255,179,71,.8);}
.nlist{flex:1;min-height:0;overflow:hidden;position:relative;}
.nit{display:flex;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid var(--stroke2);}
.nit:last-child{border-bottom:none;}
.nit .th{width:48px;height:34px;border-radius:9px;flex:none;background-size:cover;background-position:center;background-color:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.6px;}
.nit .tx{min-width:0;flex:1;}
.nit .ttl{font-size:11.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;}
#camstrip{height:171px;flex:none;display:flex;gap:8px;padding:7px;border-radius:16px;}
.ctile{flex:1;min-width:0;max-width:330px;position:relative;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid var(--stroke2);}
.ctile video,.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ctile .cap{position:absolute;left:8px;right:8px;bottom:6px;font-size:11.5px;text-shadow:0 1px 5px #000;display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;}
.ctile .cap .tag{background:rgba(0,0,0,.4);}
.ctile .live{color:var(--red);}
.ban{margin:0;font:inherit;font-size:10px;line-height:1.2;white-space:pre;color:var(--dim);}
.ban b{font-weight:600;}
.fade{animation:fadein .45s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
a{color:var(--warm);}
</style></head>
<body>
<div id="bg"></div><div id="bg2"></div><div id="scrim"></div>
<div id="app">
  <div id="bar" class="glass">
    <div style="display:flex;align-items:center;gap:10px;"><img src="/logo.png" alt="" style="height:36px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));">
      <span style="font-size:15px;letter-spacing:.5px;">Simorgh</span><span class="faint">·</span><span class="dim" id="viewname">Home</span>
      <span class="tag" id="rot" style="display:none;"></span></div>
    <div id="dock"></div>
    <div style="display:flex;align-items:center;gap:14px;font-size:12px;">
      <span class="dim" id="wx"></span>
      <span class="green" id="net">● online</span><span class="gold" id="clock" style="font-size:15px;">--:--</span>
      <span class="dim" id="date"></span><span class="faint" id="vp" style="font-size:9px;"></span></div>
  </div>
  <div id="camstrip" class="glass"></div>
  <div id="stage"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token=new URLSearchParams(location.search).get("token")||"";
const q=p=>p+(token?(p.includes("?")?"&":"?")+"token="+encodeURIComponent(token):"");
const ICONS={deck:'<path d="M3 9.5 10 3l7 6.5M5 8.2V16h4v-4h2v4h4V8.2"/>',discover:'<circle cx="10" cy="10" r="7.2"/><path d="M10 4.6l1.5 3.9 3.9 1.5-3.9 1.5L10 15.4 8.5 11.5 4.6 10l3.9-1.5z"/>',cameras:'<rect x="2.5" y="5.5" width="10" height="9" rx="1.6"/><path d="M12.5 8.5l5-2.5v8l-5-2.5z"/>',news:'<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M5.5 7h6M5.5 10h9M5.5 13h9"/>',markets:'<path d="M3 15.5V4.5M3 15.5h13.5"/><path d="M6 12l3-3 2.5 2L16 6"/>',media:'<circle cx="10" cy="10" r="7"/><path d="M8.5 7l4.5 3-4.5 3z"/>',terminal:'<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M6 8l3 2.5L6 13M11 13h3"/>',ambient:'<circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/>'};
const VIEWS=[["deck","Home"],["discover","Discover"],["cameras","Cameras"],["news","News"],["markets","Markets"],["media","Media"],["terminal","Terminal"],["ambient","Ambient"]];
const VIEW_KEYS={home:"deck",deck:"deck",discover:"discover",cameras:"cameras",news:"news",markets:"markets",media:"media",terminal:"terminal",ambient:"ambient"};

// ---- wallpapers ----
let WP=[],wpi=0,bgFlip=false;
async function loadWP(){try{const r=await fetch(q("/api/wallpapers"));WP=(await r.json()).wallpapers||[];shuffle(WP);}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function wpUrl(n){return "/wallpapers/"+encodeURIComponent(n);}
function nextWP(){ if(!WP.length) return null; wpi=(wpi+1)%WP.length; return WP[wpi]; }
function setBG(name){ if(!name) return; const show=bgFlip?$("#bg"):$("#bg2"),hide=bgFlip?$("#bg2"):$("#bg");
  const img=new Image(); img.onload=()=>{show.style.backgroundImage=`url("${wpUrl(name)}")`;show.style.opacity=1;hide.style.opacity=0;bgFlip=!bgFlip;}; img.src=wpUrl(name);}
function randWP(){ return WP.length? WP[Math.floor(Math.random()*WP.length)] : null; }

// ---- live state ----
let ACT=[],STATUS={},TV={},DATA=null,DATA_AT=0,CUR="deck",TF="1D",SEL="",PIN="",ROT=0,rotTimer=null,appliedSince=0;
async function poll(){
  try{const a=await (await fetch(q("/api/activity?limit=40"))).json();ACT=(a.events||[]).slice().reverse();$("#net").innerHTML=(a.pending_turns||[]).length?'<span class="warm">✻ thinking</span>':'<span class="green">● online</span>';}catch(e){$("#net").innerHTML='<span class="red">● offline</span>';}
  try{STATUS=await (await fetch(q("/api/status"))).json();}catch(e){}
  try{TV=await (await fetch(q("/api/tv/state"))).json();}catch(e){}
  try{const st=await (await fetch(q("/api/dash/state"))).json();applyState(st);}catch(e){}
  if(CUR==="deck") refreshDeck(false); else if(CUR==="terminal"||CUR==="news") render();
}
let warmRetries=0;
async function loadData(){
  try{DATA=await (await fetch(q("/api/dash/data"))).json();DATA_AT=Date.now();
    const w=DATA&&DATA.weather;$("#wx").textContent=w&&w.temp!=null?`${w.glyph} ${Math.round(w.temp)}° ${w.text}`:"";
    refreshStrip();
    if(CUR!=="terminal") render();
    // The collector is still warming up (Sim just started): ask again soon rather than in a minute.
    const warm=DATA&&DATA.weather&&(DATA.ambient||[]).length&&(DATA.quote||DATA.off);
    if(!warm&&warmRetries<12){warmRetries++;setTimeout(loadData,6000);}
  }catch(e){if(warmRetries<12){warmRetries++;setTimeout(loadData,6000);}}
}
function applyState(st){
  if(!st||!st.since||st.since<=appliedSince) return;
  appliedSince=st.since;
  if(st.timeframe) TF=st.timeframe;
  if(st.symbol!=null) {SEL=st.symbol||""; if(SEL) PIN=SEL;}
  if(st.rotate_s!=null) setRotate(st.rotate_s|0);
  if(st.scale!=null){SCALE=Number(st.scale)||0;fitApp();}
  if(st.live_max!=null&&Number(st.live_max)!==CAM_LIVE_MAX){CAM_LIVE_MAX=Number(st.live_max);CAMKEY="";CAMVIEWKEY="";refreshStrip();}
  if(st.video_quality&&st.video_quality!==VIDEO_QUALITY){VIDEO_QUALITY=st.video_quality;DK.np="";}
  const k=VIEW_KEYS[st.view||""];
  if(k&&k!==CUR) go(k); else render();
}
function setRotate(s){ROT=s;if(rotTimer){clearInterval(rotTimer);rotTimer=null;}
  const t=$("#rot");if(s>0){rotTimer=setInterval(()=>{const i=VIEWS.findIndex(v=>v[0]===CUR);go(VIEWS[(i+1)%VIEWS.length][0]);},s*1000);t.style.display="";t.textContent="rotating "+s+"s";}else t.style.display="none";}

// ---- helpers ----
const N=(v,d=2)=>v==null||isNaN(v)?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const P=(v,d=2)=>v==null||isNaN(v)?"—":(v>=0?"+":"")+Number(v).toFixed(d)+"%";
const cls=v=>v==null?"dim":v>=0?"green":"red";
const priceDigits=v=>v==null?2:v>=1000?0:v>=100?1:2;
function ago(ts){if(!ts)return "";const s=Math.max(0,Date.now()/1000-ts);if(s<90)return "now";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d";}
function nowT(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0");}
function nowD(){return new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}
function greet(){const h=new Date().getHours();return h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":"Good evening";}
function hhmm(iso){if(!iso)return "";const d=new Date(iso);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"p":"a";h=h%12||12;return h+":"+String(m).padStart(2,"0")+ap;}
function head(t,tag,bb){return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;"><span class="hd'+(bb?" bb":"")+'">'+t+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';}
function empty(msg){return '<div class="faint" style="font-size:11.5px;padding:6px 0;">'+esc(msg)+'</div>';}
function newsRows(items,n,opts={}){items=(items||[]).slice(0,n);if(!items.length)return empty(opts.empty||"waiting for the feed…");
  return items.map(it=>'<div class="rowitem"><span class="'+(opts.color||"gold")+'" style="flex:none;">•</span><div class="t">'+esc(it.title)+'</div><span class="m">'+(opts.src?esc(it.source)+' · ':'')+ago(it.at)+'</span></div>').join("");}
function feed(name){return (DATA&&DATA.news&&DATA.news[name])||[];}
function merged(...names){const all=[];names.forEach(n=>all.push(...feed(n)));all.sort((a,b)=>(b.at||0)-(a.at||0));return all;}
function spark(pts,col,w=84,h=26,sw=1.5){pts=(pts||[]).map(p=>Array.isArray(p)?p[1]:p);if(pts.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
  const mx=Math.max(...pts),mn=Math.min(...pts),rg=(mx-mn)||1,stp=w/(pts.length-1);
  const ln=pts.map((v,i)=>(i*stp).toFixed(1)+","+(h-2-((v-mn)/rg)*(h-4)).toFixed(1)).join(" ");
  return '<svg width="'+w+'" height="'+h+'" style="flex:none;"><polyline points="'+ln+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'"/></svg>';}
let gid=0;
function lineChart(pts,opts={}){ // pts: [[epoch_s, value]]
  pts=pts||[];if(pts.length<2)return '<div class="ch"><div class="faint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;">'+esc(opts.empty||"no series yet")+'</div></div>';
  const vals=pts.map(p=>p[1]);let mx=Math.max(...vals),mn=Math.min(...vals);
  if(opts.ref!=null&&opts.ref>0){mx=Math.max(mx,opts.ref);mn=Math.min(mn,opts.ref);}
  const pad=(mx-mn)*0.08||mx*0.005||1;mx+=pad;mn-=pad;const rg=mx-mn;
  const W=1000,H=1000,bot=opts.xlabels?60:0;
  const X=i=>(i/(pts.length-1))*W,Y=v=>((1-(v-mn)/rg)*(H-bot));
  const ln=pts.map((p,i)=>X(i).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  const col=opts.col||"#84e6a6",id="g"+(gid++);
  const grid=[0.25,0.5,0.75].map(f=>'<line x1="0" x2="'+W+'" y1="'+(f*(H-bot)).toFixed(0)+'" y2="'+(f*(H-bot)).toFixed(0)+'" stroke="rgba(255,255,255,.07)" vector-effect="non-scaling-stroke"/>').join("");
  const ref=opts.ref!=null&&opts.ref>0?'<line x1="0" x2="'+W+'" y1="'+Y(opts.ref).toFixed(1)+'" y2="'+Y(opts.ref).toFixed(1)+'" stroke="rgba(255,179,71,.55)" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>':"";
  const svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".32"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+grid+ref
    +'<polygon points="0,'+(H-bot)+' '+ln+' '+W+','+(H-bot)+'" fill="url(#'+id+')"/><polyline points="'+ln+'" fill="none" stroke="'+col+'" stroke-width="'+(opts.sw||2)+'" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
  let labels="";
  if(opts.ylabels!==false){const d=priceDigits(mx);labels+=[0,0.25,0.5,0.75,1].map(f=>{const v=mn+rg*(1-f);return '<span class="yl" style="top:'+(f*(100-(bot/H)*100)).toFixed(1)+'%;">'+N(v,d)+'</span>';}).join("");}
  if(opts.xlabels){const n=opts.xn||5;for(let k=0;k<n;k++){const i=Math.round(k*(pts.length-1)/(n-1));const pos=k===0?'left:0;transform:none;':k===n-1?'right:0;left:auto;transform:none;':'left:'+(100*i/(pts.length-1)).toFixed(1)+'%;';labels+='<span class="xl" style="'+pos+'">'+tlabel(pts[i][0],opts.tf)+'</span>';}}
  return '<div class="ch">'+svg+labels+'</div>';}
function tlabel(t,tf){const d=new Date(t*1000);
  if(tf==="1D"){let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"p":"a";h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+ap;}
  if(tf==="1W")return d.toLocaleDateString(undefined,{weekday:"short"});
  if(tf==="1M")return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return d.toLocaleDateString(undefined,{month:"short",year:"2-digit"});}
function thumb(cap,tag,img){return '<div class="thumb" style="background-image:url(\''+(img||wpUrl(randWP()||"")).replace(/'/g,"%27")+'\');"><div class="scr"></div>'+(tag?'<div class="tag">'+esc(tag)+'</div>':'')+(cap?'<div class="cap">'+cap+'</div>':'')+'</div>';}
function actLine(e){const t=e.type||"",s=esc(e.summary||"");
  if(t==="percept.text.received")return '<div style="color:#dfe3ea;">❯ '+s+'</div>';
  if(t==="turn.completed")return '<div>● '+s+'</div>';
  if(t==="task.started")return '<div class="warm">⏺ '+esc(e.kind||"task")+' · '+s+'</div>';
  if(t==="task.completed")return '<div class="green">&nbsp;&nbsp;⎿ ✅ '+s+'</div>';
  if(t==="task.failed"||t==="task.blocked")return '<div class="red">&nbsp;&nbsp;⎿ '+t.split(".")[1]+' '+s+'</div>';
  if(t==="action.result")return '<div class="dim">&nbsp;&nbsp;⏺ '+esc(e.tool||"tool")+' '+(e.ok===false?"✗":"✓")+' '+s+'</div>';
  return '<div class="dim">'+s+'</div>';}
let BANNER="";
const ANSI16={30:"#3a3f4b",31:"#ff9a94",32:"#84e6a6",33:"#f7d29b",34:"#9fb6ff",35:"#c9a9ff",36:"#9fe3ff",37:"#e6e9f0",90:"#828a99",91:"#ff9a94",92:"#84e6a6",93:"#f7d29b",94:"#9fb6ff",95:"#c9a9ff",96:"#9fe3ff",97:"#ffffff"};
function ansiToHtml(text){ // the CLI's SGR codes -> spans: 24-bit fg/bg, the 16 colours, bold, dim, reset
  let out="",open=false,fg="",bg="",bold=false,dim=false;const parts=text.split(/\x1b\[([0-9;]*)m/);
  const flush=()=>{if(open){out+="</span>";open=false;}};

async function ringLive(tile,video){ // Ring live view: WebRTC with Ring's servers, Sim carrying the SDP offer and answer
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});RTC_PEERS.push(pc);
  pc.addTransceiver("video",{direction:"recvonly"});pc.addTransceiver("audio",{direction:"recvonly"});
  pc.ontrack=e=>{if(!video.srcObject)video.srcObject=e.streams[0];video.play().catch(()=>{});};
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await new Promise(res=>{if(pc.iceGatheringState==="complete")return res();const t=setTimeout(res,3000);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==="complete"){clearTimeout(t);res();}};});
  const r=await fetch(q("/api/dash/ring/live"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:tile.name,action:"offer",sdp:pc.localDescription.sdp})});
  const body=await r.json();if(!r.ok||!body.sdp)throw new Error(body.text||body.error||"no answer");
  await pc.setRemoteDescription({type:"answer",sdp:body.sdp});
  const session=body.session;pc._session=session;pc._camera=tile.name;
  pc._keep=setInterval(()=>{fetch(q("/api/dash/ring/live"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:tile.name,action:"keepalive",session})}).catch(()=>{});},20000);
  pc.onconnectionstatechange=()=>{if(["failed","disconnected","closed"].includes(pc.connectionState)){clearInterval(pc._keep);const cap=video.parentElement&&video.parentElement.querySelector(".tag");if(cap)cap.textContent="ring · reconnecting";setTimeout(()=>{if(RTC_PEERS.includes(pc)){RTC_PEERS=RTC_PEERS.filter(x=>x!==pc);ringLive(tile,video).catch(()=>{});}},15000);}};}

  RTC_PEERS.forEach(pc=>{try{clearInterval(pc._keep);if(pc._session)fetch(q("/api/dash/ring/live"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({camera:pc._camera,action:"close",session:pc._session})}).catch(()=>{});pc.close();}catch(e){}});RTC_PEERS=[];}
function mountLive(root,tiles){ // attach players to the tiles just rendered under `root`

    if(t.rtc){ringLive(t,v).catch(()=>{const cap=v.parentElement.querySelector(".tag");if(cap)cap.textContent="ring · no live view";});return;}

    if(window.Hls&&Hls.isSupported()){const h=new Hls({lowLatencyMode:true,liveSyncDurationCount:2,maxBufferLength:6,enableWorker:true});h.loadSource(q(t.url));h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));HLS_PLAYERS.push(h);}
    else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=q(t.url);v.play().catch(()=>{});}});}

    +'<div class="glass" style="padding:12px 20px;margin-top:10px;width:min(920px,86vw);">'+hourlyStrip(10)+'</div>'
    +(qt&&qt.text?'<div class="dim" style="font-size:15px;margin-top:14px;max-width:80vw;text-align:center;">“'+esc(qt.text)+'” <span class="faint">— '+esc(qt.author)+'</span></div>':'')
    +(h?'<div class="faint" style="font-size:12.5px;margin-top:6px;max-width:80vw;text-align:center;"><span class="amber">'+esc(h.source)+'</span> '+esc(h.title)+'</div>':'')+'</div>';
}
const RENDER={deck:viewDeck,discover:viewDiscover,cameras:viewCameras,news:viewNews,markets:viewMarkets,media:viewMedia,terminal:viewTerminal,ambient:viewAmbient};

// ---- app ----
function buildDock(){$("#dock").innerHTML=VIEWS.map(([k,n])=>'<div class="dot'+(k===CUR?" on":"")+'" data-k="'+k+'" title="'+n+'"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg></div>').join("");
  $("#dock").querySelectorAll(".dot").forEach(d=>d.onclick=()=>go(d.dataset.k));}
function render(){try{if(CUR==="deck"){refreshDeck(true);return;}
  if(CUR==="cameras"){const key=stripTiles().map(t=>t.key).join("|");if(key===CAMVIEWKEY&&$("#camgrid"))return;CAMVIEWKEY=key;closeLive();CAMKEY="";setTimeout(refreshStrip,60);}
  else if(CAMVIEWKEY){CAMVIEWKEY="";closeLive();CAMKEY="";setTimeout(refreshStrip,60);}
  $("#stage").innerHTML=(RENDER[CUR]||viewDeck)();}catch(e){$("#stage").innerHTML='<div class="glass card red">render failed: '+esc(e.message)+'</div>';}}
function go(k){if(!RENDER[k])return;CUR=k;$("#viewname").textContent=(VIEWS.find(v=>v[0]===k)||[,"Home"])[1];buildDock();render();setBG(randWP());}
// A Cast receiver lays the page out at 1280x720 logical pixels whatever the panel (the creator's 4K Sony showed a
// few boxes, 2026-09-12); the page is designed at 1920x1080 and scaled to the viewport it actually gets.
let SCALE=0;   // 0 = fit the viewport; a number = the creator's override (tv scale 0.5)
function viewportSize(){const vv=window.visualViewport;
  const w=Math.max(0,Math.min(innerWidth||0,document.documentElement.clientWidth||innerWidth||0,vv?vv.width:1e9))||innerWidth||1920;
  const h=Math.max(0,Math.min(innerHeight||0,document.documentElement.clientHeight||innerHeight||0,vv?vv.height:1e9))||innerHeight||1080;
  return [w,h];}
function fitApp(){const app=$("#app");const [w,h]=viewportSize();const sc=SCALE>0?SCALE:Math.min(w/1920,h/1080);
  app.style.transform="translate("+Math.max(0,(w-1920*sc)/2).toFixed(1)+"px,"+Math.max(0,(h-1080*sc)/2).toFixed(1)+"px) scale("+sc.toFixed(4)+")";
  const r=$("#vp");if(r)r.textContent=w+"×"+h+" ·"+sc.toFixed(2)+(devicePixelRatio&&devicePixelRatio!==1?" dpr"+devicePixelRatio:"");}
addEventListener("resize",fitApp);
function tickClock(){$("#clock").textContent=nowT();$("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(CUR==="ambient"||CUR==="deck"){const c=$("#stage .big");}}
// Keys: a TV browser, a keyboard, or a remote that does reach the page.
document.addEventListener("keydown",e=>{const i=VIEWS.findIndex(v=>v[0]===CUR);
  if(e.key==="ArrowRight"||e.key==="MediaTrackNext")go(VIEWS[(i+1)%VIEWS.length][0]);
  else if(e.key==="ArrowLeft"||e.key==="MediaTrackPrevious")go(VIEWS[(i-1+VIEWS.length)%VIEWS.length][0]);
  else if(/^[1-8]$/.test(e.key))go(VIEWS[parseInt(e.key)-1][0]);
  else if(e.key==="Enter"||e.key===" "){if(CUR==="markets"){const t=["1D","1W","1M","1Y"];TF=t[(t.indexOf(TF)+1)%4];render();}else go("markets");}
  else if(e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||e.key==="BrowserBack")go("deck");
  else return; e.preventDefault();});

(async function(){fitApp();[300,1000,3000,8000].forEach(ms=>setTimeout(fitApp,ms));   // receivers settle their viewport late
  await loadWP();setBG(WP[0]);buildDock();render();tickClock();
  setInterval(tickClock,1000);
  setInterval(()=>setBG(nextWP()),45000);
  setInterval(()=>{if(CUR==="ambient")render();},30000);
  setInterval(()=>{if(CUR==="deck")refreshDeck(false);},1000);   // the Home boxes rotate on their own clock
  poll();setInterval(poll,4000);
  loadBanner();refreshStrip();
  loadData();setInterval(loadData,60000);
  setInterval(pollStreams,10000);    // the strip follows the relays within ten seconds
  setInterval(watchPlayers,15000);
})();
</script></body></html>
