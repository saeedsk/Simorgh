<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0b0c; --fg:#d0d0d0; --dim:#6c6c6c; --warm:#ac7f4f; --green:#5faf5f; --cyan:#5fd7ff; --red:#d75f5f; --rule:#3a3a3a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:22px/1.35 ui-monospace, Menlo, "SF Mono", monospace; }
  #screen { display:grid; grid-template-rows: 1fr auto; height:100vh; padding:24px 32px; box-sizing:border-box; gap:12px; }
  #main { display:grid; grid-template-columns: 1fr; gap:20px; min-height:0; }
  #main.framed { grid-template-columns: 3fr 2fr; }
  #transcript { overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; min-height:0; white-space:pre-wrap; word-break:break-word; }
  #transcript .line { margin:2px 0; }
  .dim { color:var(--dim); } .warm { color:var(--warm); } .green { color:var(--green); } .cyan { color:var(--cyan); } .red { color:var(--red); }
  #frame { display:none; align-self:center; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:#000; aspect-ratio:16/9; }
  #main.framed #frame { display:block; }
  #frame video, #frame iframe { width:100%; height:100%; border:0; display:block; }
  #frame .title { position:absolute; margin:8px 12px; color:var(--fg); text-shadow:0 0 6px #000; font-size:18px; }
  #ribbon { border-top:1px solid var(--rule); padding-top:8px; color:var(--dim); font-size:20px; display:flex; gap:24px; }
  #ribbon .spark { color:var(--warm); }
  #prompt { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:6px 0; color:#bcbcbc; }
</style></head>
<body><div id="screen">
  <div id="main">
    <div id="transcript"></div>
    <div id="frame"></div>
  </div>
  <div>
    <div id="prompt">❯ <span class="dim">Sim is listening</span></div>
    <div id="ribbon"><span><span class="spark">✻</span> <span id="state">starting…</span></span><span id="status"></span></div>
  </div>
</div>
<script>
(function () {
  const token = new URLSearchParams(location.search).get("token") || "";
  const q = (path) => path + (token ? (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : "");
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const SPARKS = ["·", "+", "✶", "✻", "✶", "+"];
  let tick = 0;

  function line(e) {
    const t = e.type || "", s = e.summary || "";
    if (t === "percept.text.received") return `<div class="line"><span style="color:#bcbcbc">❯</span> ${esc(s)}</div>`;
    if (t === "turn.completed") return `<div class="line">● ${esc(s)}</div>`;
    if (t === "task.started") return `<div class="line warm">⏺ ${esc(e.kind || "task")} · ${esc(s)}</div>`;
    if (t === "task.completed") return `<div class="line green">  ⎿  ✅ completed ${esc(s)}</div>`;
    if (t === "task.failed" || t === "task.blocked") return `<div class="line red">  ⎿  ❌ ${esc(t.split(".")[1])} ${esc(s)}</div>`;
    if (t === "action.result") return `<div class="line dim">  ⏺ ${esc(e.tool || "tool")} ${e.ok === false ? "✗" : "✓"} ${esc(s)}</div>`;
    if (t === "action.denied") return `<div class="line red">  ⏺ ${esc(s)}</div>`;
    return `<div class="line dim">${esc(s)}</div>`;
  }

  async function refresh() {
    try {
      const r = await fetch(q("/api/activity?limit=40")); const a = await r.json();
      const events = (a.events || []).slice().reverse();
      el("transcript").innerHTML = events.map(line).join("");
      el("state").textContent = (a.pending_turns || []).length ? "thinking…" : "listening";
    } catch (e) { el("state").textContent = "no connection to Sim"; }
    try {
      const r = await fetch(q("/api/status")); const st = await r.json();
      const parts = [];
      if (st.model) parts.push(st.model); if (st.posture) parts.push(st.posture); if (st.auto !== undefined) parts.push("auto " + (st.auto ? "on" : "off"));
      el("status").textContent = parts.join(" · ");
    } catch (e) {}
    try {
      const r = await fetch(q("/api/tv/state")); const tv = await r.json();
      frame(tv);
    } catch (e) {}
  }

  let shown = "";
  function frame(tv) {
    const main = el("main"), box = el("frame");
    if (tv.mode !== "frame" || !tv.url) { if (shown) { box.innerHTML = ""; shown = ""; } main.classList.remove("framed"); return; }
    main.classList.add("framed");
    if (shown === tv.url) return;
    shown = tv.url;
    const yt = tv.url.match(/(?:youtu\.be\/|v=|\/embed\/)([\w-]{6,})/);
    const title = tv.title ? `<div class="title">${esc(tv.title)}</div>` : "";
    box.innerHTML = yt
      ? `${title}<iframe src="https://www.youtube.com/embed/${yt[1]}?autoplay=1&mute=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
      : `${title}<video src="${esc(tv.url)}" autoplay playsinline controls></video>`;
  }

  setInterval(() => { tick++; document.querySelector("#ribbon .spark").textContent = SPARKS[tick % SPARKS.length]; }, 300);
  refresh(); setInterval(refresh, 1500);
})();
</script></body></html>
