# Tool groups (stage 17 items 3 and 6,
# docs/plan/stage-17-tool-routing-and-prompt-compression.md).
#
# What a chat or spoken turn is OFFERED when `[orchestration] tool_routing`
# is "shadow" or "on" (`orchestration/routing.py`). Never what is allowed:
# Guardian decides every call, and `tool_more` adds any group back.
#
# Every tool in the chat and voice_chat agents belongs to exactly one group
# (tests/simorgh/orchestration/test_tool_routing.py pins it): a tool added to
# an agent file needs a line here too. Tools may be named by pattern
# (`cam_*`), matched the way an agent file's are.
#
# Each group: a one-line description, and 5-15 example utterances in English
# and 5-15 in Farsi. The router compares a turn's text to the centroid of
# these, so they should sound like what people actually say. `core = true`
# is offered on every turn whatever the router says.
#
# `conversational` has no tools: when a turn is closest to it by
# `route_none_margin`, only the core group is offered (item 6).
#
# Protected like the agent files (guardian/config.py protects agents/).

