description = "The calendar, the mail, and reminders."
tools = ["cal_list", "mail_search", "mail_read", "mail_unsubscribe", "remind"]
utterances = [
    "what's on today",
    "what's on my calendar tomorrow",
    "did the plumber reply",
    "any new emails from the school",
    "search my mail for the invoice",
    "check my email",
